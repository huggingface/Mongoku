name: Publish to Docker Hub and NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.package-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        run: npm install -g corepack@latest && corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Log NPM version
        run: npm -v

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm format:check

      - name: Run linter
        run: pnpm lint

      - name: Run type checking
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Bump version
        run: npm version ${INPUTS_VERSION} -m "🔖 mongoku@%s"
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Get new version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Push changes
        run: |
          git push
          git push --tags

      - name: Publish to NPM
        run: pnpm publish --no-git-checks

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # amd64 only here - the arm64 image is built natively in the publish-arm64
      # job below, since running the Vite/Tailwind build under QEMU emulation is
      # known to crash native toolchain binaries (esbuild, @tailwindcss/oxide).
      # The two per-arch images are merged into multi-arch tags in merge-manifests.
      - name: Build and push Docker image (amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: huggingface/mongoku:${{ steps.package-version.outputs.version }}-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish compat version (MongoDB driver 5.9.2 for MongoDB < 4.2 and DocumentDB < 5.0)
      - name: Add MongoDB driver version 5.9.2 override for compat version
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
          pkg.version = pkg.version + '-compat';
          pkg.pnpm = { overrides: { mongodb: '5.9.2' } };
          fs.writeFileSync('./package.json', JSON.stringify(pkg, null, '\t'));
          "

      - name: Reinstall dependencies with MongoDB override
        run: pnpm install --no-frozen-lockfile

      - name: Build compat version
        run: pnpm build

      - name: Publish compat version to NPM
        run: pnpm publish --no-git-checks --tag compat

      - name: Build and push Docker image (compat, amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: huggingface/mongoku:${{ steps.package-version.outputs.version }}-compat-amd64
          cache-from: type=gha

      - name: Restore package.json
        run: git checkout package.json

      # - name: Update Docker Hub description
      #   uses: peter-evans/dockerhub-description@v5
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_MONGOKU_PASSWORD }}
      #     repository: huggingface/mongoku
      #     readme-filepath: ./README.md

      # - name: Create GitHub Release
      #   uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e  # v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     tag_name: v${{ steps.package-version.outputs.version }}
      #     release_name: Release v${{ steps.package-version.outputs.version }}
      #     draft: false
      #     prerelease: false

      # hack - reuse actions/setup-node@v4 just to set a new registry
      # - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      #   with:
      #     node-version: "24"
      #     registry-url: "https://npm.pkg.github.com"

      # - run: pnpm publish --no-git-checks .
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-arm64:
    permissions:
      contents: read
    needs: publish
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.publish.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Native arm64 runner - the Dockerfile's build stage (pnpm build via Vite/Tailwind)
      # runs natively here, avoiding QEMU emulation crashes in native-binary tooling.
      - name: Build and push Docker image (arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: huggingface/mongoku:${{ needs.publish.outputs.version }}-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup pnpm
        run: npm install -g corepack@latest && corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: "pnpm"

      # Same MongoDB driver override as the amd64 compat build, so the compat
      # image's package.json/lockfile match on both architectures.
      - name: Add MongoDB driver version 5.9.2 override for compat version
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
          pkg.version = pkg.version + '-compat';
          pkg.pnpm = { overrides: { mongodb: '5.9.2' } };
          fs.writeFileSync('./package.json', JSON.stringify(pkg, null, '\t'));
          "

      - name: Reinstall dependencies with MongoDB override
        run: pnpm install --no-frozen-lockfile

      - name: Build and push Docker image (compat, arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: huggingface/mongoku:${{ needs.publish.outputs.version }}-compat-arm64
          cache-from: type=gha

  merge-manifests:
    permissions: {}
    needs: [publish, publish-arm64]
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t huggingface/mongoku:latest \
            -t huggingface/mongoku:${NEEDS_PUBLISH_OUTPUTS_VERSION} \
            huggingface/mongoku:${NEEDS_PUBLISH_OUTPUTS_VERSION}-amd64 \
            huggingface/mongoku:${NEEDS_PUBLISH_OUTPUTS_VERSION}-arm64
        env:
          NEEDS_PUBLISH_OUTPUTS_VERSION: ${{ needs.publish.outputs.version }}

      - name: Create multi-arch manifest (compat)
        run: |
          docker buildx imagetools create \
            -t huggingface/mongoku:compat \
            -t huggingface/mongoku:${NEEDS_PUBLISH_OUTPUTS_VERSION}-compat \
            huggingface/mongoku:${NEEDS_PUBLISH_OUTPUTS_VERSION}-compat-amd64 \
            huggingface/mongoku:${NEEDS_PUBLISH_OUTPUTS_VERSION}-compat-arm64
        env:
          NEEDS_PUBLISH_OUTPUTS_VERSION: ${{ needs.publish.outputs.version }}
